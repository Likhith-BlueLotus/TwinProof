[project]
name = "twinproof"
version = "0.1.0"
description = "Film it. Twin it. Prove it. Verified control from phone video."
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
# add openai, modal, fastapi as the phases that call them land
dependencies = [
  "cma>=4.5.0",
  "fastapi>=0.162.0",
  "meta-sam-parser>=0.1.0",
  "modal>=1.6.3",
  "mujoco>=3.17.0",
  "numpy>=2.1",
  "openai>=3.41.0",
  "opencv-contrib-python-headless>=5.0.0.93",
  "scipy>=1.14",
  "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["verifier/tests", "tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Could not import matplotlib:UserWarning"]
